<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kadraj Rehberi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: ekranı dolduran vizör, üstünde tek satır yönlendirme; altta üç düğmeli çubuk. Ayrıntılar istenince açılır. Tek tema: karanlık vizör. */
:root{
  color-scheme:dark;
  --bg:#14161a;
  --panel:#1c1f24;
  --line:#2f343b;
  --ink:#eceae4;
  --muted:#939aa3;
  --accent:#5fd0e6;
  --good:#8bd69b;
  --mid:#e8c45a;
  --bad:#ff6b5e;
  --font-body:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.35}
.app{min-height:100%;display:flex;flex-direction:column}
.stage{position:relative;display:flex;justify-content:center;align-items:center;background:#0a0b0d}
canvas#view{display:block;touch-action:manipulation;max-width:100%}
.tag{position:absolute;top:10px;left:12px;font-family:var(--font-mono);font-size:.66rem;letter-spacing:.06em;color:rgba(255,255,255,.75);background:rgba(0,0,0,.45);padding:3px 7px}
.hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);background:rgba(10,11,13,.74);padding:9px 16px 9px 12px;border-radius:22px;font-size:1.08rem;font-weight:500;display:flex;gap:10px;align-items:center}
.hint::before{content:"";flex:none;width:10px;height:10px;border-radius:50%;background:var(--mid)}
.hint[data-s="good"]::before{background:var(--good)}
.hint[data-s="bad"]::before{background:var(--bad)}
.bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:10px 16px}
.bar>:first-child{justify-self:start}
.bar>:last-child{justify-self:end}
.mid{display:flex;justify-content:center}
button,.btn{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);padding:9px 12px;border-radius:3px;cursor:pointer;min-height:44px;display:inline-flex;align-items:center}
button:focus-visible,.btn:focus-within,canvas:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.primary{border-color:var(--ink);background:var(--ink);color:var(--bg);font-weight:600;padding:9px 18px}
.shutter{width:64px;height:64px;min-height:64px;border-radius:50%;border:3px solid var(--ink);background:transparent;padding:0;position:relative}
.shutter::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--ink)}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.more{width:100%;max-width:720px;margin:0 auto;padding:6px 16px 28px;display:grid;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:8px}
h2{font-size:.72rem;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.crit{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.crit li{display:grid;grid-template-columns:14px 1fr auto;column-gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.crit .mark{width:12px;height:12px;border-radius:50%;border:2px solid var(--muted)}
.crit li[data-s="good"] .mark{background:var(--good);border-color:var(--good)}
.crit li[data-s="mid"] .mark{border-color:var(--mid);background:linear-gradient(90deg,var(--mid) 50%,transparent 50%)}
.crit li[data-s="bad"] .mark{border-color:var(--bad)}
.crit .name{font-weight:600}
.crit .val{font-family:var(--font-mono);font-size:.8rem;font-variant-numeric:tabular-nums;color:var(--muted);text-align:right}
.crit .det{grid-column:2 / 4;color:var(--muted);font-size:.9rem}
.note{color:var(--muted);font-size:.86rem;margin:0;max-width:65ch}
</style>
</head>
<body>
<div class="app">
  <section class="stage" id="stageBox" aria-label="Vizör">
    <canvas id="view" tabindex="0" aria-label="Vizör. Özneyi işaretlemek için dokun."></canvas>
    <span class="tag" id="modeLabel">ÖRNEK SAHNE</span>
    <div class="hint" id="hint" role="status" aria-live="polite">Analiz ediliyor</div>
  </section>

  <div class="bar" id="bar">
    <button type="button" id="guideBtn">Kılavuz: Oto</button>
    <div class="mid">
      <button type="button" class="shutter" id="shotBtn" aria-label="Fotoğrafı çek ve kaydet" hidden></button>
      <button type="button" class="primary" id="liveBtn" hidden>Kamerayı aç</button>
      <label class="btn primary" id="fileMain" for="fileInput">Fotoğraf çek</label>
    </div>
    <button type="button" id="moreBtn" aria-expanded="false" aria-controls="more">Ayrıntı</button>
  </div>

  <div class="more" id="more" hidden>
    <div class="row">
      <label class="btn" for="fileInput">Fotoğraf seç
        <input class="visually-hidden" type="file" id="fileInput" accept="image/*">
      </label>
      <button type="button" id="ghostBtn" hidden>Kareyi hayalet olarak tut</button>
      <button type="button" id="autoSubjBtn" hidden>Özneyi otomatik bul</button>
      <button type="button" id="levelBtn" hidden>Ufku düzelt</button>
      <button type="button" id="cropBtn" hidden>Önerilen kırpmayı uygula</button>
      <button type="button" id="origBtn" hidden>Özgün kareye dön</button>
      <button type="button" id="demoBtn" hidden>Örnek sahne</button>
    </div>
    <div>
      <h2>Ölçütler</h2>
      <ul class="crit" id="crit"></ul>
    </div>
    <p class="note" id="note">Halka özneyi, hedef işareti gitmesi gereken noktayı gösterir. Özne yanlışsa vizörde özneye dokun. Tüm analiz cihazında yapılır, görüntü hiçbir yere gönderilmez.</p>
  </div>
</div>

<script>
(function(){
"use strict";
var PHI=(1+Math.sqrt(5))/2, AW=96;
var $=function(id){return document.getElementById(id)};
var view=$("view"), ctx=view.getContext("2d");
var small=document.createElement("canvas"), sctx=small.getContext("2d",{willReadFrequently:true});
var video=document.createElement("video"); video.setAttribute("playsinline",""); video.muted=true;

var state={mode:"demo",src:null,sw:960,sh:720,guide:"auto",autoGuide:"thirds",spiralOri:0,tap:null,prev:null,res:null,ev:null,stream:null,lastT:0,more:false,hintShown:"",hintCand:"",hintN:0,orig:null,crop:null,ghost:null,ghostHint:""};

/* ---------- görüntü analizi ---------- */
function boxBlur(src,w,h,r){
  var W=w+1,I=new Float64Array(W*(h+1)),out=new Float32Array(w*h),x,y;
  for(y=0;y<h;y++){var row=0;for(x=0;x<w;x++){row+=src[y*w+x];I[(y+1)*W+x+1]=I[y*W+x+1]+row;}}
  for(y=0;y<h;y++){var y0=Math.max(0,y-r),y1=Math.min(h,y+r+1);
    for(x=0;x<w;x++){var x0=Math.max(0,x-r),x1=Math.min(w,x+r+1);
      out[y*w+x]=(I[y1*W+x1]-I[y0*W+x1]-I[y1*W+x0]+I[y0*W+x0])/((x1-x0)*(y1-y0));}}
  return out;
}
function analyze(img,w,h,tap,prev){
  var n=w*h,d=img.data,i,x,y;
  var L=new Float32Array(n),A=new Float32Array(n),B=new Float32Array(n),mL=0,mA=0,mB=0;
  for(i=0;i<n;i++){var r=d[i*4],g=d[i*4+1],b=d[i*4+2];L[i]=.299*r+.587*g+.114*b;A[i]=r-g;B[i]=.5*(r+g)-b;mL+=L[i];mA+=A[i];mB+=B[i];}
  mL/=n;mA/=n;mB/=n;
  var R=Math.max(4,Math.round(w/8));
  var Ls=boxBlur(L,w,h,1),As=boxBlur(A,w,h,1),Bs=boxBlur(B,w,h,1);
  var Ll=boxBlur(L,w,h,R),Al=boxBlur(A,w,h,R),Bl=boxBlur(B,w,h,R);
  var sal=new Float32Array(n),rowM=new Float32Array(h),colM=new Float32Array(w);
  for(y=0;y<h;y++)for(x=0;x<w;x++){i=y*w+x;
    var s=Math.abs(Ls[i]-Ll[i])+.7*(Math.abs(As[i]-Al[i])+Math.abs(Bs[i]-Bl[i]))
         +.35*(Math.abs(Ls[i]-mL)+.7*(Math.abs(As[i]-mA)+Math.abs(Bs[i]-mB)));
    sal[i]=s;rowM[y]+=s/w;colM[x]+=s/h;}
  var raw=boxBlur(sal,w,h,2),rawMean=0;for(i=0;i<n;i++)rawMean+=raw[i]/n;
  for(y=0;y<h;y++)for(x=0;x<w;x++){i=y*w+x;sal[i]=Math.max(0,sal[i]-Math.max(rowM[y],colM[x]));}
  var S=boxBlur(sal,w,h,2),mx=0,sum=0;
  for(i=0;i<n;i++){if(S[i]>mx)mx=S[i];sum+=S[i];}
  var meanS=sum/n;

  /* özne */
  function peakIn(cx,cy,rad){var best=-1,bi=-1;
    for(var yy=Math.max(0,cy-rad);yy<=Math.min(h-1,cy+rad);yy++)for(var xx=Math.max(0,cx-rad);xx<=Math.min(w-1,cx+rad);xx++){var k=yy*w+xx;if(S[k]>best){best=S[k];bi=k;}}
    return {i:bi,v:best};}
  var pk=null,gp={i:0,v:-1};
  for(i=0;i<n;i++)if(S[i]>gp.v)gp={i:i,v:S[i]};
  if(tap){pk=peakIn(Math.round(tap.x*w),Math.round(tap.y*h),Math.round(w/(prev&&tap.track?6:9)));}
  else if(prev){var lp=peakIn(Math.round(prev.x*w),Math.round(prev.y*h),Math.round(w/8));pk=(gp.v>lp.v*1.3)?gp:lp;}
  else pk=gp;
  var subj=null;
  if(pk.v>5||tap){
    var px=pk.i%w,py=(pk.i-px)/w,th=pk.v*.3,mask=new Uint8Array(n),stack=[pk.i],cnt=0,x0=px,x1=px,y0=py,y1=py,wx=0,wy=0,ws=0;
    mask[pk.i]=1;
    while(stack.length&&cnt<n*.35){var k=stack.pop(),kx=k%w,ky=(k-kx)/w;cnt++;
      if(kx<x0)x0=kx;if(kx>x1)x1=kx;if(ky<y0)y0=ky;if(ky>y1)y1=ky;wx+=kx*S[k];wy+=ky*S[k];ws+=S[k];
      var nb=[kx>0?k-1:-1,kx<w-1?k+1:-1,ky>0?k-w:-1,ky<h-1?k+w:-1];
      for(var q=0;q<4;q++){var m=nb[q];if(m>=0&&!mask[m]&&S[m]>th){mask[m]=1;stack.push(m);}}}
    var cx=ws>0?wx/ws:px,cy=ws>0?wy/ws:py;
    if(cnt<4||cnt>=n*.35){var hw=Math.round(w*.07);x0=Math.max(0,px-hw);x1=Math.min(w-1,px+hw);y0=Math.max(0,py-hw);y1=Math.min(h-1,py+hw);cx=px;cy=py;}
    /* figür-zemin */
    var sl=0,sa=0,sb=0,sc=0,rl=0,ra=0,rb=0,rc=0;
    var ex=Math.max(2,Math.round((x1-x0+1)*.5)),ey=Math.max(2,Math.round((y1-y0+1)*.5));
    for(y=Math.max(0,y0-ey);y<=Math.min(h-1,y1+ey);y++)for(x=Math.max(0,x0-ex);x<=Math.min(w-1,x1+ex);x++){i=y*w+x;
      if(x>=x0&&x<=x1&&y>=y0&&y<=y1){if(mask[i]||cnt<4){sl+=Ls[i];sa+=As[i];sb+=Bs[i];sc++;}}
      else{rl+=Ls[i];ra+=As[i];rb+=Bs[i];rc++;}}
    var sep=(sc&&rc)?(Math.abs(sl/sc-rl/rc)+.7*(Math.abs(sa/sc-ra/rc)+Math.abs(sb/sc-rb/rc)))/255:0;
    subj={x:(cx+.5)/w,y:(cy+.5)/h,x0:x0/w,y0:y0/h,x1:(x1+1)/w,y1:(y1+1)/h,sep:sep,px0:x0,px1:x1,py0:y0,py1:y1};
  }

  /* kenarlar ve çizgiler */
  var mag=new Float32Array(n),ang=new Float32Array(n),em=0;
  for(y=1;y<h-1;y++)for(x=1;x<w-1;x++){i=y*w+x;
    var gx=-Ls[i-w-1]-2*Ls[i-1]-Ls[i+w-1]+Ls[i-w+1]+2*Ls[i+1]+Ls[i+w+1];
    var gy=-Ls[i-w-1]-2*Ls[i-w]-Ls[i-w+1]+Ls[i+w-1]+2*Ls[i+w]+Ls[i+w+1];
    mag[i]=Math.sqrt(gx*gx+gy*gy);ang[i]=Math.atan2(gy,gx);em+=mag[i];}
  em/=n;var ev=0;for(i=0;i<n;i++){var dv=mag[i]-em;ev+=dv*dv;}
  var eth=Math.max(24,em+1.2*Math.sqrt(ev/n));
  var D=Math.ceil(Math.sqrt(w*w+h*h)),NR=2*D+1,acc=new Float32Array(180*NR);
  for(y=1;y<h-1;y++)for(x=1;x<w-1;x++){i=y*w+x;if(mag[i]<eth)continue;
    var t0=Math.round(ang[i]*180/Math.PI);
    for(var dt=-10;dt<=10;dt++){var t=((t0+dt)%180+180)%180,tr=t*Math.PI/180;
      var rho=Math.round(x*Math.cos(tr)+y*Math.sin(tr))+D;acc[t*NR+rho]+=1;}}
  var lines=[],minV=Math.min(w,h)*.3;
  for(var kk=0;kk<8;kk++){var bv=0,bt=0,br=0;
    for(var t2=0;t2<180;t2++)for(var r2=1;r2<NR-1;r2++){var v=acc[t2*NR+r2-1]+acc[t2*NR+r2]+acc[t2*NR+r2+1];if(v>bv){bv=v;bt=t2;br=r2;}}
    if(bv<minV)break;
    lines.push({t:bt,rho:br-D,v:bv});
    for(var a=-7;a<=7;a++){var tt=((bt+a)%180+180)%180;
      for(var rr=Math.max(0,br-6);rr<=Math.min(NR-1,br+6);rr++)acc[tt*NR+rr]=0;
      if(bt+a<0||bt+a>=180){var fr=2*D-br;for(rr=Math.max(0,fr-6);rr<=Math.min(NR-1,fr+6);rr++)acc[tt*NR+rr]=0;}}}
  var diag=Math.sqrt(w*w+h*h),hor=null,ver=null,obl=[];
  lines.forEach(function(l){
    var tr=l.t*Math.PI/180,c=Math.cos(tr),s=Math.sin(tr),p,q;
    if(Math.abs(s)>.5){p=[0,l.rho/s];q=[w,(l.rho-w*c)/s];}else{p=[l.rho/c,0];q=[(l.rho-h*s)/c,h];}
    l.a=[p[0]/w,p[1]/h];l.b=[q[0]/w,q[1]/h];
    l.dist=subj?Math.abs(subj.x*w*c+subj.y*h*s-l.rho)/diag:1;
    if(Math.abs(l.t-90)<=12){l.kind="h";l.tilt=l.t-90;if(!hor&&l.v>=w*.45)hor=l;}
    else if(l.t<=12||l.t>=168){l.kind="v";l.tilt=l.t<=12?l.t:l.t-180;if(!ver&&l.v>=h*.45)ver=l;}
    else{l.kind="o";if(obl.length<3)obl.push(l);}
  });

  /* ağırlık dengesi, boşluk, kenar bandı */
  var bx=0,by=0,bs=0,empty=0;
  for(y=0;y<h;y++)for(x=0;x<w;x++){i=y*w+x;var wg=(mx>0?S[i]/mx:0)+(mag[i]>=eth?.3:0);bx+=x*wg;by+=y*wg;bs+=wg;if(wg<.1)empty++;}
  var bal=bs>0?{x:(bx/bs+.5)/w,y:(by/bs+.5)/h}:{x:.5,y:.5};
  var band=Math.max(2,Math.round(w*.07)),sides={sol:0,"sağ":0,"üst":0,alt:0},cn={sol:0,"sağ":0,"üst":0,alt:0};
  function inSubj(xx,yy){return subj&&xx>=subj.px0-1&&xx<=subj.px1+1&&yy>=subj.py0-1&&yy<=subj.py1+1;}
  for(y=0;y<h;y++)for(x=0;x<w;x++){if(inSubj(x,y))continue;var val=raw[y*w+x];
    if(x<band){sides.sol+=val;cn.sol++;}if(x>=w-band){sides["sağ"]+=val;cn["sağ"]++;}
    if(y<band){sides["üst"]+=val;cn["üst"]++;}if(y>=h-band){sides.alt+=val;cn.alt++;}}
  var distract=[];
  Object.keys(sides).forEach(function(k){var m=cn[k]?sides[k]/cn[k]:0;if(m>rawMean*1.7)distract.push(k);});
  var cut=[];
  if(subj){var mg=Math.max(1,Math.round(w*.025));
    if(subj.px0<mg)cut.push("sol");if(subj.px1>=w-mg)cut.push("sağ");if(subj.py0<mg)cut.push("üst");if(subj.py1>=h-mg)cut.push("alt");}
  return {w:w,h:h,subj:subj,lines:lines,hor:hor,ver:ver,obl:obl,bal:bal,empty:empty/n,distract:distract,cut:cut};
}

/* ---------- kılavuzlar ---------- */
var spiralCache=null;
function spiral(){
  if(spiralCache)return spiralCache;
  var x0=0,y0=0,w=PHI,h=1,pts=[],k,s,c,p0,p1;
  for(k=0;k<11;k++){
    var m=k%4;
    if(m===0){s=h;c=[x0+s,y0+s];p0=[x0,y0+s];p1=[x0+s,y0];x0+=s;w-=s;}
    else if(m===1){s=w;c=[x0,y0+s];p0=[x0,y0];p1=[x0+s,y0+s];y0+=s;h-=s;}
    else if(m===2){s=h;c=[x0+w-s,y0];p0=[x0+w,y0];p1=[x0+w-s,y0+s];w-=s;}
    else{s=w;c=[x0+s,y0+h-s];p0=[x0+s,y0+h];p1=[x0,y0+h-s];h-=s;}
    var a0=Math.atan2(p0[1]-c[1],p0[0]-c[0]),a1=Math.atan2(p1[1]-c[1],p1[0]-c[0]),da=a1-a0;
    while(da>Math.PI)da-=2*Math.PI;while(da<-Math.PI)da+=2*Math.PI;
    for(var j=0;j<=14;j++){var a=a0+da*j/14;pts.push([(c[0]+s*Math.cos(a))/PHI,c[1]+s*Math.sin(a)]);}
  }
  spiralCache={pts:pts,pole:[(x0+w/2)/PHI,y0+h/2]};
  return spiralCache;
}
function oriPt(p,o){return [(o&1)?1-p[0]:p[0],(o&2)?1-p[1]:p[1]];}
function targets(g,aspect,ori){
  var a,b;
  if(g==="thirds"){a=1/3;b=2/3;return [[a,a],[b,a],[a,b],[b,b]];}
  if(g==="phi"){a=1-1/PHI;b=1/PHI;return [[a,a],[b,a],[a,b],[b,b]];}
  if(g==="center")return [[.5,.5]];
  if(g==="spiral")return [oriPt(spiral().pole,ori)];
  var t=aspect*aspect/(aspect*aspect+1);
  return [[t,t],[1-t,1-t],[1-t,t],[t,1-t]];
}
function nearest(g,s,aspect,ori){
  var best=null;
  targets(g,aspect,ori).forEach(function(t){var d=Math.hypot((t[0]-s.x)*aspect,(t[1]-s.y))/Math.hypot(aspect,1);if(!best||d<best.d)best={x:t[0],y:t[1],d:d};});
  return best;
}
var embedded=true;try{embedded=window.top!==window.self;}catch(e){embedded=true;}
var canLive=!embedded&&!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia);
var GNAME={thirds:"üçler",phi:"altın oran",spiral:"spiral",diag:"diyagonal",center:"merkez"};
function posName(t){
  var h=t.x<.45?"sol":t.x>.55?"sağ":"",v=t.y<.45?"üst":t.y>.55?"alt":"";
  return (h||v)?(h+" "+v).trim():"merkez";
}

/* ---------- değerlendirme ---------- */
function clamp(v){return Math.max(0,Math.min(1,v));}
function evaluate(r){
  var aspect=r.w/r.h,g=state.guide,s=r.subj,C=[],issues=[],tgt=null;
  if(g==="auto"){
    if(s){var cur=nearest(state.autoGuide,s,aspect,0),bestG=state.autoGuide,bd=cur.d;
      ["thirds","phi","diag","center"].forEach(function(k){var d=nearest(k,s,aspect,0).d;if(d<bd-.03){bd=d;bestG=k;}});
      state.autoGuide=bestG;}
    g=state.autoGuide;
  }
  /* konum */
  if(s&&g==="spiral"){var bo=0,bdd=9;for(var oo=0;oo<4;oo++){var dd=nearest(g,s,aspect,oo).d;if(dd<bdd){bdd=dd;bo=oo;}}state.spiralOri=bo;}
  if(s){tgt=nearest(g,s,aspect,state.spiralOri);
    var sc=clamp(1-(tgt.d-.03)/.15),det;
    if(tgt.d<=.045)det="Özne "+posName(tgt)+" güç noktasında.";
    else{var dx=tgt.x-s.x,dy=tgt.y-s.y,parts=[];
      if(Math.abs(dx)>.035)parts.push(dx>0?"kamerayı sola çevir":"kamerayı sağa çevir");
      if(Math.abs(dy)>.035)parts.push(dy>0?"yukarı kaldır":"aşağı indir");
      det=(sc>=.7?"Özne "+posName(tgt)+" noktaya yakın. İnce ayar: ":"Özneyi "+posName(tgt)+" noktaya taşı: ")+parts.join(", ")+".";}
    C.push({k:"pos",name:"Özne konumu",score:sc,val:GNAME[g],det:det});
    if(sc<.7){var sh0=parts.join(" · ").replace(/kamerayı /g,"");issues.push({w:1,score:sc,text:det,short:sh0.charAt(0).toUpperCase()+sh0.slice(1)});}
  }else C.push({k:"pos",name:"Özne konumu",score:null,val:"yok",det:"Belirgin bir özne bulunamadı. Vizörde özneye dokun."});
  /* ufuk */
  var ref=r.hor||r.ver;
  if(ref){var tl=ref.tilt,at=Math.abs(tl),sc2=clamp(1-(at-.5)/4.5),what=r.hor?"Ufuk":"Dikey çizgiler",d2;
    if(at<1)d2=what+" düz.";
    else d2=what+" yaklaşık "+at+"° eğik: kamerayı "+(tl>0?"saat yönünde":"saat yönünün tersine")+" döndür.";
    C.push({k:"tilt",name:"Ufuk ve dikeyler",score:sc2,val:(tl>0?"+":"")+tl+"°",det:d2});
    if(sc2<.7)issues.push({w:1.3,score:sc2,text:d2,short:"Eğik · "+(tl>0?"saat yönünde":"saat yönünün tersine")+" döndür"});
  }else C.push({k:"tilt",name:"Ufuk ve dikeyler",score:null,val:"yok",det:"Kadrajda baskın yatay ya da dikey çizgi yok."});
  /* denge */
  var lr=r.bal.x,off=Math.abs(lr-.5)*2,sc3=clamp(1-(off-.3)/.5),pct=Math.round(Math.max(lr,1-lr)*100),side=lr<.5?"solda":"sağda",d3;
  if(off<.3)d3="Görsel ağırlık iki yana dengeli dağılıyor.";
  else d3="Ağırlık "+side+" toplanmış. Karşı tarafta dengeleyen bir öğe ara ya da boşluğu bilerek bırak.";
  C.push({k:"bal",name:"Görsel denge",score:sc3,val:(off<.1?"orta":side+" "+pct+"%"),det:d3});
  if(sc3<.5)issues.push({w:.5,score:sc3,text:d3});
  /* çizgiler */
  if(r.obl.length&&s){var lead=r.obl.filter(function(l){return l.dist<.08;}).length,md=Math.min.apply(null,r.obl.map(function(l){return l.dist;}));
    var sc4=clamp(1-(md-.04)/.2),d4=lead?(lead+" çizgi gözü özneye taşıyor."):"Çizgiler özneyi ıskalıyor. Bir adım yana geçip çizgiyi özneye bağla.";
    C.push({k:"lines",name:"Öncü çizgiler",score:sc4,val:lead+"/"+r.obl.length,det:d4});
    if(sc4<.6)issues.push({w:.5,score:sc4,text:d4});
  }else C.push({k:"lines",name:"Öncü çizgiler",score:null,val:"yok",det:"Belirgin eğik çizgi yok."});
  /* boşluk ve ölçek */
  if(s){var ar=(s.x1-s.x0)*(s.y1-s.y0),sc5,d5;
    if(ar<.012){sc5=clamp(ar/.012*.5);d5="Özne kadrajda çok küçük kalıyor. Yaklaş ya da kadrajı daralt.";}
    else if(ar>.6){sc5=.6;d5="Özne kadrajı dolduruyor. Nefes alanı istiyorsan bir adım geri çekil.";}
    else{sc5=1;d5="Özne ölçeği yerinde, çevresinde yeterli boşluk var.";}
    C.push({k:"space",name:"Negatif alan",score:sc5,val:"özne "+Math.max(1,Math.round(ar*100))+"% · boş "+Math.round(r.empty*100)+"%",det:d5});
    if(sc5<.7)issues.push({w:.8,score:sc5,text:d5,short:ar<.012?"Yaklaş":null});
  }else C.push({k:"space",name:"Negatif alan",score:null,val:"boş "+Math.round(r.empty*100)+"%",det:"Özne olmadan ölçek hesaplanamıyor."});
  /* kenarlar */
  var sc6=1,d6="Kenarlar temiz.";
  if(r.cut.length){sc6=.15;d6="Özne "+r.cut.join(" ve ")+" kenarda kesiliyor. Ya tamamen içeri al ya da kararlı biçimde kes.";}
  else if(r.distract.length){sc6=.5;d6=r.distract.join(", ")+" kenarda dikkat çeken bir öğe var. Kadrajı hafif kaydırıp dışarıda bırak.";d6=d6.charAt(0).toUpperCase()+d6.slice(1);}
  C.push({k:"edge",name:"Kenar kontrolü",score:sc6,val:r.cut.length?"kesik":r.distract.length?r.distract.join(" "):"temiz",det:d6});
  if(sc6<.7)issues.push({w:1.2,score:sc6,text:d6,short:r.cut.length?"Özne kenarda kesiliyor":null});
  /* figür-zemin */
  if(s){var sc7=clamp(s.sep/.2),d7=sc7>=.7?"Özne zeminden net ayrışıyor.":"Özne zemine karışıyor. Açını değiştir ya da daha sade, zıt tonda bir zemin bul.";
    C.push({k:"sep",name:"Figür-zemin",score:sc7,val:"kontrast "+Math.round(s.sep*100),det:d7});
    if(sc7<.7)issues.push({w:.9,score:sc7,text:d7});
  }else C.push({k:"sep",name:"Figür-zemin",score:null,val:"yok",det:"Özne işaretlenince ölçülür."});
  issues.sort(function(a,b){return (1-b.score)*b.w-(1-a.score)*a.w;});
  var shl=issues.filter(function(q){return q.short;});
  var main=shl.length?{text:shl[0].short,s:shl[0].score<.4?"bad":"mid"}:(s?{text:"Hazır",s:"good"}:{text:"Özneye dokun",s:"mid"});
  return {crit:C,main:main,target:tgt,guide:g};
}
function suggestCrop(r,e){
  var s=r.subj;if(!s||state.mode==="live")return null;
  var aspect=r.w/r.h,best=null;
  targets(e.guide,aspect,state.spiralOri).forEach(function(t){
    var c=Math.min(1,s.x/t[0],(1-s.x)/(1-t[0]),s.y/t[1],(1-s.y)/(1-t[1]));
    var ox=s.x-t[0]*c,oy=s.y-t[1]*c;
    if(s.x0<ox||s.x1>ox+c||s.y0<oy||s.y1>oy+c)return;
    if(!best||c>best.c)best={x:ox,y:oy,c:c};});
  return best&&best.c>=.4&&best.c<.96?best:null;
}
function st(score){return score==null?"none":score>=.7?"good":score>=.4?"mid":"bad";}

/* ---------- çizim ---------- */
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
var COL={};
function line2(pts,col,wd,dash){
  ctx.save();ctx.lineJoin="round";ctx.setLineDash(dash||[]);
  ctx.beginPath();pts.forEach(function(p,i){if(i)ctx.lineTo(p[0],p[1]);else ctx.moveTo(p[0],p[1]);});
  ctx.strokeStyle="rgba(0,0,0,.45)";ctx.lineWidth=wd+2;ctx.stroke();
  ctx.strokeStyle=col;ctx.lineWidth=wd;ctx.stroke();ctx.restore();
}
function drawGuide(g,W,H,dpr){
  var c="rgba(255,255,255,.55)",wd=1*dpr,P=function(u,v){return [u*W,v*H];};
  function grid(a,b){[a,b].forEach(function(t){line2([P(t,0),P(t,1)],c,wd);line2([P(0,t),P(1,t)],c,wd);});}
  if(g==="thirds")grid(1/3,2/3);
  else if(g==="phi")grid(1-1/PHI,1/PHI);
  else if(g==="center"){line2([P(.5,0),P(.5,1)],c,wd);line2([P(0,.5),P(1,.5)],c,wd,[6*dpr,6*dpr]);}
  else if(g==="spiral"){line2(spiral().pts.map(function(p){var o=oriPt(p,state.spiralOri);return P(o[0],o[1]);}),c,wd*1.3);}
  else{var a=W/H,t=a*a/(a*a+1);
    line2([P(0,0),P(1,1)],c,wd);line2([P(1,0),P(0,1)],c,wd);
    [[[1,0],[t,t]],[[0,1],[1-t,1-t]],[[0,0],[1-t,t]],[[1,1],[t,1-t]]].forEach(function(s){
      var dx=s[1][0]-s[0][0],dy=s[1][1]-s[0][1],k=Math.min(dx?((dx>0?1:0)-s[0][0])/dx:1e9,dy?((dy>0?1:0)-s[0][1])/dy:1e9);
      line2([P(s[0][0],s[0][1]),P(s[0][0]+dx*k,s[0][1]+dy*k)],"rgba(255,255,255,.5)",wd);});
  }
}
function ring(x,y,rad,col,dpr){ctx.save();ctx.beginPath();ctx.arc(x,y,rad,0,7);ctx.strokeStyle="rgba(0,0,0,.5)";ctx.lineWidth=4*dpr;ctx.stroke();ctx.strokeStyle=col;ctx.lineWidth=2*dpr;ctx.stroke();ctx.restore();}
function render(){
  var W=view.width,H=view.height,dpr=W/parseFloat(view.style.width||W);
  if(state.src)ctx.drawImage(state.src,0,0,W,H);
  if(state.ghost&&state.mode==="live"){ctx.save();ctx.globalAlpha=.38;ctx.drawImage(state.ghost,0,0,W,H);ctx.restore();}
  var r=state.res,e=state.ev;if(!r||!e)return;
  drawGuide(e.guide,W,H,dpr);
  var cr=state.more?state.crop:null;
  if(cr){var cx=cr.x*W,cy=cr.y*H,cw=cr.c*W,ch=cr.c*H;
    ctx.save();ctx.fillStyle="rgba(0,0,0,.55)";ctx.fillRect(0,0,W,cy);ctx.fillRect(0,cy+ch,W,H-cy-ch);ctx.fillRect(0,cy,cx,ch);ctx.fillRect(cx+cw,cy,W-cx-cw,ch);ctx.restore();
    line2([[cx,cy],[cx+cw,cy],[cx+cw,cy+ch],[cx,cy+ch],[cx,cy]],COL.good,2*dpr,[8*dpr,5*dpr]);}
  var ref=r.hor||r.ver;
  if(ref&&Math.abs(ref.tilt)>=2)line2([[ref.a[0]*W,ref.a[1]*H],[ref.b[0]*W,ref.b[1]*H]],COL.mid,1.5*dpr);
  var s=r.subj,t=e.target;
  if(s&&t){var sx=s.x*W,sy=s.y*H,tx=t.x*W,ty=t.y*H,ok=t.d<=.075,col=ok?COL.good:COL.accent;
    ring(sx,sy,13*dpr,col,dpr);
    if(!ok){var an=Math.atan2(ty-sy,tx-sx),L=9*dpr,k=7*dpr;
      line2([[tx-k,ty],[tx+k,ty]],col,2*dpr);line2([[tx,ty-k],[tx,ty+k]],col,2*dpr);
      var ax=sx+Math.cos(an)*13*dpr,ay=sy+Math.sin(an)*13*dpr,bx=tx-Math.cos(an)*12*dpr,by=ty-Math.sin(an)*12*dpr;
      if(Math.hypot(tx-sx,ty-sy)>34*dpr){line2([[ax,ay],[bx,by]],col,2*dpr);
        line2([[bx-Math.cos(an-.5)*L,by-Math.sin(an-.5)*L],[bx,by],[bx-Math.cos(an+.5)*L,by-Math.sin(an+.5)*L]],col,2*dpr);}}}
}
function renderPanel(){
  var e=state.ev,ul=$("crit");if(!e)return;
  if(ul.children.length!==e.crit.length){ul.innerHTML="";e.crit.forEach(function(){var li=document.createElement("li");
    li.innerHTML='<span class="mark" aria-hidden="true"></span><span class="name"></span><span class="val"></span><span class="det"></span><span class="meter" aria-hidden="true"><i></i></span>';ul.appendChild(li);});}
  e.crit.forEach(function(c,i){var li=ul.children[i];li.dataset.s=st(c.score);
    li.querySelector(".name").textContent=c.name;li.querySelector(".val").textContent=c.val;li.querySelector(".det").textContent=c.det;
    li.querySelector("i").style.width=(c.score==null?0:Math.round(c.score*100))+"%";});
  var h=$("hint"),txt=e.main.text;
  if(txt!==state.hintShown){
    if(txt===state.hintCand)state.hintN++;else{state.hintCand=txt;state.hintN=1;}
    if(state.mode!=="live"||state.hintN>=3){state.hintShown=txt;h.textContent=txt;h.dataset.s=e.main.s;}
  }else h.dataset.s=e.main.s;
}

/* ---------- akış ---------- */
function layout(){
  var box=$("stageBox"),availH=Math.max(220,window.innerHeight-$("bar").offsetHeight),cw=box.clientWidth,aspect=state.sw/state.sh;
  box.style.minHeight=availH+"px";
  var w=Math.min(cw,availH*aspect),h=w/aspect,dpr=Math.min(2,window.devicePixelRatio||1);
  view.style.width=Math.round(w)+"px";view.style.height=Math.round(h)+"px";
  view.width=Math.round(w*dpr);view.height=Math.round(h*dpr);
}
function runAnalysis(){
  if(!state.src)return;
  var aw=AW,ah=Math.max(32,Math.min(170,Math.round(AW*state.sh/state.sw)));
  if(state.sh>state.sw){ah=128;aw=Math.max(48,Math.round(128*state.sw/state.sh));}
  small.width=aw;small.height=ah;sctx.drawImage(state.src,0,0,aw,ah);
  var img;try{img=sctx.getImageData(0,0,aw,ah);}catch(err){return;}
  var live=state.mode==="live",tap=state.tap;
  if(tap&&live&&state.prev)tap={x:state.prev.x,y:state.prev.y,track:true};
  state.res=analyze(img,aw,ah,tap,live&&!tap?state.prev:null);
  state.prev=state.res.subj?{x:state.res.subj.x,y:state.res.subj.y}:null;
  state.ev=evaluate(state.res);
  state.crop=suggestCrop(state.res,state.ev);
  var ref=state.res.hor||state.res.ver;
  $("cropBtn").hidden=!state.crop;
  $("levelBtn").hidden=live||!ref||Math.abs(ref.tilt)<1;
  $("origBtn").hidden=live||!state.orig||state.src===state.orig;
  renderPanel();
}
function refresh(){layout();runAnalysis();render();}
function setMode(m,label){
  state.mode=m;$("modeLabel").textContent=label;state.tap=null;state.prev=null;state.crop=null;state.ghost=null;if(m==="live")state.orig=null;
  $("demoBtn").hidden=(m==="demo");$("shotBtn").hidden=(m!=="live");$("ghostBtn").hidden=(m!=="live");$("ghostBtn").textContent="Kareyi hayalet olarak tut";$("autoSubjBtn").hidden=true;
  $("liveBtn").hidden=!canLive||m==="live";$("fileMain").hidden=canLive;
  if(m!=="live"&&state.stream){state.stream.getTracks().forEach(function(t){t.stop();});state.stream=null;}
}
function demoScene(){
  var c=document.createElement("canvas");c.width=960;c.height=720;var g=c.getContext("2d");
  var sky=g.createLinearGradient(0,0,0,430);sky.addColorStop(0,"#b9c7d3");sky.addColorStop(1,"#ead9c2");g.fillStyle=sky;g.fillRect(0,0,960,720);
  g.save();g.translate(480,400);g.rotate(2.6*Math.PI/180);
  var land=g.createLinearGradient(0,0,0,360);land.addColorStop(0,"#4a5a52");land.addColorStop(1,"#232b28");g.fillStyle=land;g.fillRect(-900,0,1800,700);
  g.fillStyle="#c2b89f";g.beginPath();g.moveTo(-470,340);g.lineTo(-250,340);g.lineTo(78,34);g.lineTo(66,34);g.closePath();g.fill();
  g.restore();
  g.save();g.translate(552,452);g.scale(1.9,1.9);g.translate(-552,-452);
  g.fillStyle="#20262b";g.beginPath();g.arc(552,338,13,0,7);g.fill();
  g.fillStyle="#c9432b";g.beginPath();g.moveTo(534,356);g.lineTo(570,356);g.lineTo(576,418);g.lineTo(528,418);g.closePath();g.fill();
  g.fillStyle="#20262b";g.fillRect(538,418,11,34);g.fillRect(555,418,11,34);g.restore();
  g.fillStyle="#2a3230";g.beginPath();g.moveTo(960,96);g.lineTo(884,150);g.lineTo(930,176);g.lineTo(872,236);g.lineTo(960,250);g.closePath();g.fill();
  return c;
}
function useSrc(c){state.src=c;state.sw=c.width;state.sh=c.height;state.tap=null;state.prev=null;$("autoSubjBtn").hidden=true;refresh();}
function showDemo(){setMode("demo","ÖRNEK SAHNE");state.orig=demoScene();useSrc(state.orig);}
function toCanvas(src,w,h){var k=Math.min(1,2000/Math.max(w,h)),c=document.createElement("canvas");c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext("2d").drawImage(src,0,0,c.width,c.height);return c;}
function loadFile(f){
  function done(src,w,h){if(!w||!h){fail();return;}setMode("photo","FOTOĞRAF");state.orig=toCanvas(src,w,h);useSrc(state.orig);}
  function fail(){$("hint").textContent="Fotoğraf açılamadı (tür: "+(f.type||"bilinmiyor")+"). Kamera ayarında biçimi JPEG yapıp yeniden dene.";$("hint").dataset.s="bad";}
  function viaReader(){var fr=new FileReader();fr.onload=function(){var im=new Image();im.onload=function(){done(im,im.naturalWidth,im.naturalHeight);};im.onerror=fail;im.src=fr.result;};fr.onerror=fail;fr.readAsDataURL(f);}
  if(window.createImageBitmap)createImageBitmap(f).then(function(b){done(b,b.width,b.height);}).catch(viaReader);else viaReader();
}
$("cropBtn").addEventListener("click",function(){var cr=state.crop;if(!cr)return;
  var c=document.createElement("canvas");c.width=Math.round(state.sw*cr.c);c.height=Math.round(state.sh*cr.c);
  c.getContext("2d").drawImage(state.src,cr.x*state.sw,cr.y*state.sh,c.width,c.height,0,0,c.width,c.height);useSrc(c);});
$("levelBtn").addEventListener("click",function(){var ref=state.res&&(state.res.hor||state.res.ver);if(!ref)return;
  var th=ref.tilt*Math.PI/180,a=state.sw/state.sh,k=1/(Math.cos(Math.abs(th))+Math.sin(Math.abs(th))*Math.max(a,1/a));
  var c=document.createElement("canvas");c.width=Math.round(state.sw*k);c.height=Math.round(state.sh*k);var g=c.getContext("2d");
  g.translate(c.width/2,c.height/2);g.rotate(-th);g.drawImage(state.src,-state.sw/2,-state.sh/2);useSrc(c);});
$("ghostBtn").addEventListener("click",function(){
  if(state.ghost){state.ghost=null;this.textContent="Kareyi hayalet olarak tut";renderPanel();return;}
  if(!video.videoWidth)return;
  state.ghost=toCanvas(video,video.videoWidth,video.videoHeight);state.ghostHint=state.ev?state.ev.main.text:"";this.textContent="Hayaleti kaldır";renderPanel();});
$("origBtn").addEventListener("click",function(){if(state.orig)useSrc(state.orig);});

$("fileInput").addEventListener("change",function(ev){
  var f=ev.target.files&&ev.target.files[0];if(!f)return;
  loadFile(f);ev.target.value="";
});
$("demoBtn").addEventListener("click",showDemo);
$("autoSubjBtn").addEventListener("click",function(){state.tap=null;state.prev=null;this.hidden=true;runAnalysis();render();});
var GORDER=["auto","thirds","phi","spiral","diag","center"],GLABEL={auto:"Oto",thirds:"Üçler",phi:"Altın oran",spiral:"Spiral",diag:"Diyagonal",center:"Merkez"};
$("guideBtn").addEventListener("click",function(){
  state.guide=GORDER[(GORDER.indexOf(state.guide)+1)%GORDER.length];this.textContent="Kılavuz: "+GLABEL[state.guide];
  if(state.res){state.ev=evaluate(state.res);state.crop=suggestCrop(state.res,state.ev);$("cropBtn").hidden=!state.crop;renderPanel();render();}
});
$("moreBtn").addEventListener("click",function(){
  state.more=!state.more;$("more").hidden=!state.more;this.setAttribute("aria-expanded",state.more?"true":"false");this.textContent=state.more?"Kapat":"Ayrıntı";render();
});
view.addEventListener("pointerdown",function(ev){
  var r=view.getBoundingClientRect();
  state.tap={x:(ev.clientX-r.left)/r.width,y:(ev.clientY-r.top)/r.height};state.prev=null;
  $("autoSubjBtn").hidden=false;runAnalysis();if(state.mode==="live"&&state.res&&state.res.subj)state.prev={x:state.res.subj.x,y:state.res.subj.y};render();
});

/* canlı kamera: yalnızca sayfa kendi başına açıldığında (gömülü önizlemede tarayıcı kamerayı vermez) */
if(!canLive)$("note").textContent+=" Canlı kamera bu önizlemede kullanılamıyor; fotoğraf çekerek analiz edebilirsin.";
function loop(ts){
  if(state.mode!=="live")return;
  if(video.videoWidth){
    if(state.sw!==video.videoWidth||state.sh!==video.videoHeight){state.sw=video.videoWidth;state.sh=video.videoHeight;layout();}
    if(ts-state.lastT>180){state.lastT=ts;runAnalysis();}
    render();
  }
  requestAnimationFrame(loop);
}
function startLive(){
  navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1920},height:{ideal:1440}},audio:false}).then(function(s){
    setMode("live","CANLI");state.stream=s;video.srcObject=s;state.src=video;
    return video.play();
  }).then(function(){requestAnimationFrame(loop);}).catch(function(){
    if(state.mode==="live")showDemo();
    var m="Kamera açılmadı. İzin verip Kamerayı aç'a dokun.";state.hintShown=m;$("hint").textContent=m;$("hint").dataset.s="bad";
  });
}
$("liveBtn").addEventListener("click",startLive);
$("shotBtn").addEventListener("click",function(){
  if(!video.videoWidth)return;
  var c=document.createElement("canvas");c.width=video.videoWidth;c.height=video.videoHeight;c.getContext("2d").drawImage(video,0,0);
  c.toBlob(function(b){if(!b)return;var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="kadraj-"+Date.now()+".jpg";document.body.appendChild(a);a.click();a.remove();},"image/jpeg",.94);
});

["accent","good","mid","bad"].forEach(function(k){COL[k]=css("--"+k);});
var rz;window.addEventListener("resize",function(){clearTimeout(rz);rz=setTimeout(function(){layout();render();},120);});
showDemo();
if(canLive)startLive();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(render);
})();
